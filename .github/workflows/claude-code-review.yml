name: Claude Code Review

on:
  pull_request:
    # Review once, when the PR is ready. The code-review plugin skips drafts and
    # PRs it already commented on, so running on every push did nothing.
    # Add the `re-review` label to review the current diff again.
    types: [opened, ready_for_review, reopened, labeled]

jobs:
  claude-review:
    if: |
      (github.event.action != 'labeled' && !github.event.pull_request.draft) ||
      github.event.label.name == 're-review'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment is required: without it the plugin prints the review to the
          # terminal and posts nothing. See plugins/code-review in anthropics/claude-code.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            ${{ github.event.label.name == 're-review' && 'This is an explicit re-review request: review the current diff even if Claude has already commented on this PR.' || '' }}
          claude_args: "--effort high"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Remove re-review label
        if: github.event.label.name == 're-review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label re-review
