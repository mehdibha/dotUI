# Consumer templates (see examples/README.md): each is a real app with the
# registry's resolved output committed — styles collapsed to its preset, icon
# imports swapped, params inlined. The output is regenerated with the real
# shadcn CLI and committed with the registry change that caused it, like every
# other generated file in the repo.
#
# On every pull request and merge-group run that touches the registry, the
# publisher, the /r/* routes, presets, or examples/, each template is
# regenerated from scratch against the branch's registry, built, and
# type-checked, and the result must match what is committed. Drift fails the
# check with the patch as an artifact: run `pnpm smoke:examples` and commit.
#
# The publisher's own tests never invoke the CLI, so the regeneration is also
# the only check on where files land and how imports resolve in a consumer.

name: Examples

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      origin:
        description: "Registry origin to regenerate from (e.g. a Vercel preview URL). Empty serves this checkout locally."
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A required check has to report on every PR, so the workflow always runs
  # and decides in-job whether the change can affect consumer output. A
  # skipped verify job counts as passing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(www/src/registry/|www/src/publisher/|www/src/routes/r/|www/src/lib/registry-preset\.ts|www/src/lib/fonts\.ts|www/src/modules/presets/presets-data\.ts|www/src/modules/create/preset/|packages/colors/|examples/|\.github/workflows/examples\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing that reaches consumer output changed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.example }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example:
          - origin-next
          - origin-tanstack-start
          - spotify-next
          - spotify-tanstack-start
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # With no --origin the script builds the registry, serves it with the www
      # dev server, and stops it when done. shadcn's own base files come from
      # the vendored copies, so the run never reaches ui.shadcn.com. The
      # dispatch input reaches the shell through an env var, never by
      # interpolation into the command line.
      - name: Regenerate, build, type-check
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          set -o pipefail
          node examples/scripts/smoke.ts --example "${{ matrix.example }}" ${ORIGIN:+--origin "$ORIGIN"} 2>&1 | tee smoke.log

      - name: Committed template must match
        run: |
          git add -A -- examples/${{ matrix.example }}
          if git diff --cached --quiet -- examples/${{ matrix.example }}; then
            echo "### ${{ matrix.example }}: matches the registry" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached -- examples/${{ matrix.example }} > examples-${{ matrix.example }}.patch
          {
            echo "### ${{ matrix.example }}: committed template is stale"
            echo
            echo '```'
            git --no-pager diff --cached --stat -- examples/${{ matrix.example }}
            echo '```'
            echo
            echo "Run \`pnpm smoke:examples\` and commit \`examples/\`. Full patch in the \`examples-${{ matrix.example }}\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::examples/${{ matrix.example }} is stale — run pnpm smoke:examples and commit the result"
          exit 1

      - name: Smoke log on failure
        if: failure()
        run: |
          {
            echo "### ${{ matrix.example }}: smoke log (tail)"
            echo '```'
            tail -n 200 smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure() && hashFiles('examples-*.patch') != ''
        with:
          name: examples-${{ matrix.example }}
          path: examples-*.patch
          retention-days: 14
