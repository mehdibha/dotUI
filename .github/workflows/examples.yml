# Consumer templates (see examples/README.md): each is a real app with the
# registry's resolved output committed — styles collapsed to its preset, icon
# imports swapped, params inlined. Nobody maintains that output by hand:
#
#   - On pull requests, every template is regenerated from scratch with the real
#     shadcn CLI (init, then add every item) against the branch's registry, then
#     built and type-checked. The resulting diff against the committed template
#     goes into the job summary and a patch artifact, so a registry change is
#     reviewable as the consumer-facing files it changes. Drift never fails a PR.
#   - On push to main, one job regenerates all templates and commits the result
#     back to main, so `examples/` always matches what the registry serves.
#
# The publisher's own tests never invoke the CLI, so the regeneration is also
# the only check on where files land and how imports resolve in a consumer.

name: Examples

on:
  pull_request:
    paths:
      - "www/src/registry/**"
      - "www/src/publisher/**"
      - "www/src/routes/r/**"
      - "www/src/lib/registry-preset.ts"
      - "www/src/lib/fonts.ts"
      - "www/src/modules/presets/presets-data.ts"
      - "www/src/modules/create/preset/**"
      - "examples/**"
      - ".github/workflows/examples.yml"
  push:
    branches: [main]
    paths:
      - "www/src/registry/**"
      - "www/src/publisher/**"
      - "www/src/routes/r/**"
      - "www/src/lib/registry-preset.ts"
      - "www/src/lib/fonts.ts"
      - "www/src/modules/presets/presets-data.ts"
      - "www/src/modules/create/preset/**"
      - "examples/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:
    inputs:
      origin:
        description: "Registry origin to regenerate from (e.g. a Vercel preview URL). Empty serves this checkout locally."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Pull requests: regenerate per template, report the diff, never commit.
  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    name: ${{ matrix.example }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example:
          - origin-next
          - origin-tanstack-start
          - spotify-next
          - spotify-tanstack-start
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # With no --origin the script builds the registry, serves it with the www
      # dev server, and stops it when done.
      - name: Regenerate, build, type-check
        run: node examples/scripts/smoke.ts --example ${{ matrix.example }} ${{ inputs.origin && format('--origin {0}', inputs.origin) || '' }}

      - name: Report what changed for consumers
        run: |
          git add -A -- examples/${{ matrix.example }}
          if git diff --cached --quiet -- examples/${{ matrix.example }}; then
            echo "### ${{ matrix.example }}: no change for consumers" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached -- examples/${{ matrix.example }} > examples-${{ matrix.example }}.patch
          {
            echo "### ${{ matrix.example }}: consumer-facing changes"
            echo
            echo '```'
            git --no-pager diff --cached --stat -- examples/${{ matrix.example }}
            echo '```'
            echo
            echo "Full patch in the \`examples-${{ matrix.example }}\` artifact. \`main\` regenerates and commits this on merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: hashFiles('examples-*.patch') != ''
        with:
          name: examples-${{ matrix.example }}
          path: examples-*.patch
          retention-days: 14

  # main: regenerate everything and commit the result back.
  commit:
    if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(examples): regenerate') }}
    runs-on: ubuntu-latest
    name: Regenerate and commit
    timeout-minutes: 45
    permissions:
      contents: write
    # One regeneration at a time; a newer push supersedes an in-flight one.
    concurrency:
      group: examples-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Regenerate, build, type-check
        run: node examples/scripts/smoke.ts

      - name: Commit if anything changed
        run: |
          git add -A -- examples
          if git diff --cached --quiet -- examples; then
            echo "examples/ already matches the registry"
            exit 0
          fi
          git --no-pager diff --cached --stat -- examples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(examples): regenerate templates" -m "Registry output changed in ${{ github.sha }}; regenerated with the real shadcn CLI."
          git push origin HEAD:main
