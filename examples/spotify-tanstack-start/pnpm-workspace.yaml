# Makes this example its own pnpm workspace root, so `pnpm install` — and the
# `pnpm add` the shadcn CLI spawns — resolve here instead of folding the app
# into the monorepo workspace and writing its dependencies into the root lockfile.
packages: []
minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/react-start-client@1.168.39'
  - '@tanstack/react-start-rsc@0.1.59'
  - '@tanstack/react-start-server@1.167.46'
  - '@tanstack/react-start@1.168.60'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - '@tanstack/start-client-core@1.170.34'
  - '@tanstack/start-plugin-core@1.171.49'
  - '@tanstack/start-server-core@1.169.39'
  - '@tanstack/start-storage-context@1.167.36'
  - '@internationalized/number@3.6.9'
  - '@react-types/shared@3.37.0'
  - react-aria-components@1.22.0
  - react-aria@3.53.0
  - react-stately@3.51.0
